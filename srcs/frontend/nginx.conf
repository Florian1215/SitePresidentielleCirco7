upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API Django REST + administration Django
    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Fichiers statiques de l'admin Django et images uploadées
    location ^~ /django-static/ {
        alias /srv/django-static/;
        expires 7d;
    }

    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # Fichiers de l'application Angular (noms hashés => cache long)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Routage côté client Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}

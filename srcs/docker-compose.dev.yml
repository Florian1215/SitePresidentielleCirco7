# Environnement de DÉVELOPPEMENT : rechargement à chaud du frontend et du backend.
#   Tout le site sur une seule URL : http://localhost:${DEV_FRONTEND_PORT:-4200}
#     /api/, /admin/  → Django (runserver)      · le reste → Vite (React)
#   Ports modifiables dans srcs/.env (DEV_FRONTEND_PORT, DEV_DB_PORT)
name: presidentielle-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DEV_DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./requirements/backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:${DEV_FRONTEND_PORT:-4200},http://127.0.0.1:${DEV_FRONTEND_PORT:-4200}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./requirements/backend:/app
      - media_data:/app/media

  frontend:
    build:
      context: ./requirements/frontend
      target: dev
    volumes:
      - ./requirements/frontend:/app
      # node_modules reste celui de l'image (binaires Linux), pas celui de la machine hôte
      - /app/node_modules

  # Seul service exposé : répartit les requêtes entre Django et le frontend
  nginx:
    build:
      context: ./requirements/nginx
      target: dev
    depends_on:
      - backend
      - frontend
    ports:
      - "${DEV_FRONTEND_PORT:-4200}:80"

volumes:
  db_data:
  media_data:

# Environnement de PRODUCTION : gunicorn + build Vite (React), derrière nginx.
#   Tout le site sur une seule URL : http://localhost:${HTTP_PORT:-8080}
#     /api/, /admin/  → Django (gunicorn)       · le reste → frontend (build React)
name: presidentielle

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./requirements/backend
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  frontend:
    build:
      context: ./requirements/frontend
      target: prod
    restart: unless-stopped

  # Seul service exposé : répartit les requêtes entre Django et le frontend
  nginx:
    build:
      context: ./requirements/nginx
      target: prod
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/srv/django-static:ro
      - media_data:/srv/media:ro

volumes:
  db_data:
  static_data:
  media_data:

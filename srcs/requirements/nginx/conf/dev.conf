# DÉVELOPPEMENT : tout passe par http://localhost:${DEV_FRONTEND_PORT}
upstream django   { server backend:8000; }
upstream frontend { server frontend:4200; }

# Websocket du rechargement à chaud de Vite
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/common.conf;

    # En dev, runserver sert lui-même les fichiers de l'admin et les images envoyées
    location ~ ^/(django-static|media)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
    }

    # Tout le reste : serveur de développement Vite (React)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
}

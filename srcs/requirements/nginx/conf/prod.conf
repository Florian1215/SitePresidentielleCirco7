# PRODUCTION : tout passe par http://<serveur>:${HTTP_PORT}
upstream django   { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/common.conf;

    # Fichiers statiques de l'admin Django (collectstatic) et images envoyées : servis directement
    location ^~ /django-static/ {
        alias /srv/django-static/;
        expires 7d;
    }
    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # Tout le reste : application React (build Vite servi par le conteneur frontend)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
    }
}

# Réglages communs aux deux environnements (inclus dans le bloc server).
client_max_body_size 10m;   # images d'articles (réduites ensuite par Django)

gzip on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

# API Django REST + administration Django
location ~ ^/(api|admin)(/|$) {
    proxy_pass http://django;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 60s;
}

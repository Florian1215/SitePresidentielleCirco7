# Serveur statique du build React (conteneur frontend, production).
# Il n'est pas exposé : le service nginx (srcs/requirements/nginx) lui transmet tout ce qui n'est pas /api, /admin…
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers de l'application (noms hashés => cache long)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Routage côté client (React Router) : toute autre adresse renvoie l'application
    location / {
        try_files $uri $uri/ /index.html;
    }
}

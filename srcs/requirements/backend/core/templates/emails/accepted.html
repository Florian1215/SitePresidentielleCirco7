{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 10px;font-family:'Config Titre','Arial Narrow',Impact,sans-serif;font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase;color:#4c0297;">
  Bienvenue {{ member.first_name }}&nbsp;!
</h1>
<p style="margin:0 0 24px;font-size:17px;line-height:1.45;color:#4a4a4a;">Votre compte est validé.</p>
<a class="btn" href="{{ login_url }}"
   style="display:block;background:#d1271c;border:2px solid #d1271c;border-radius:10px;padding:15px 10px;text-align:center;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#fffcf4;text-decoration:none;">
  Se connecter
</a>
{% endblock %}

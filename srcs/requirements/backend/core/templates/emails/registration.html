{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 22px;font-family:'Config Titre','Arial Narrow',Impact,sans-serif;font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase;color:#4c0297;">
  Nouvelle demande d'inscription
</h1>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#ffffff;border:2px solid #e5cbff;border-radius:10px;">
  <tr>
    <td style="padding:20px 22px;">
      <div style="font-size:22px;font-weight:700;line-height:1.2;color:#212320;">{{ member.first_name }} {{ member.last_name }}</div>
      <div style="padding-top:6px;font-size:15px;">
        <a href="mailto:{{ member.email }}" style="color:#4c0297;text-decoration:none;">{{ member.email }}</a>
      </div>
      <div style="padding-top:14px;">
        <span style="display:inline-block;background:#e5cbff;color:#4c0297;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;">
          {{ group_name }}
        </span>
      </div>
    </td>
  </tr>
</table>

<table role="presentation" class="stack" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;">
  <tr>
    <td class="col" width="50%" style="padding-right:6px;">
      <a class="btn" href="{{ accept_url }}"
         style="display:block;background:#4c0297;border:2px solid #4c0297;border-radius:10px;padding:15px 10px;text-align:center;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#fffcf4;text-decoration:none;">
        ✓&nbsp;Accepter
      </a>
    </td>
    <td class="col" width="50%" style="padding-left:6px;">
      <a class="btn" href="{{ refuse_url }}"
         style="display:block;background:#fffcf4;border:2px solid #d1271c;border-radius:10px;padding:15px 10px;text-align:center;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#d1271c;text-decoration:none;">
        ✕&nbsp;Refuser
      </a>
    </td>
  </tr>
</table>
{% endblock %}
